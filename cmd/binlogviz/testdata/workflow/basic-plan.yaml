version: 1

workflow:
  name: multi-window-test
  output_dir: PLACEHOLDER/artifacts

defaults:
  input:
    from_dir: PLACEHOLDER/binlog
    prefix: mysql-bin.
  analyze:
    format: json
  snapshot:
    save: true

windows:
  - name: week1
    start: 2025-01-01T00:00:00Z
    end: 2099-12-31T23:59:59Z
  - name: week2
    start: 2025-01-01T00:00:00Z
    end: 2099-12-31T23:59:59Z

compare:
  - name: week2_vs_week1
    current: week2
    baseline: week1
    formats: [json, html]

trend:
  - name: weekly_series
    snapshots: [week1, week2]
    formats: [json, html]
