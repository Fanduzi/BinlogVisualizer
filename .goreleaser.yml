# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# input: git tags, module source tree, and native CGO-capable build environments for supported release platforms.
# output: a single source of truth for release artifact naming and native-target build settings used by the release workflow and local static validation.
# pos: release packaging contract that keeps GoReleaser, the GitHub workflow, and install docs aligned without changing runtime behavior.
# note: CI native runners are the only trusted multi-platform release path for this DuckDB/CGO project; local goreleaser usage is limited to check/single-target validation.
version: 2

project_name: binlogviz

before:
  hooks:
    - go test ./...

builds:
  - id: binlogviz
    binary: binlogviz
    main: .
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X binlogviz/internal/version.Version={{ .Version }} -X binlogviz/internal/version.Commit={{ .FullCommit }} -X binlogviz/internal/version.CommitTime={{ .CommitDate }}

archives:
  - id: release-archive
    ids:
      - binlogviz
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README_ZH.md
      - src: docs/agents/USING-BINLOGVIZ.md
        dst: docs/agents/USING-BINLOGVIZ.md
      - src: docs/agents/USING-BINLOGVIZ.zh-CN.md
        dst: docs/agents/USING-BINLOGVIZ.zh-CN.md
      - src: docs/reference/analyze-behavior.md
        dst: docs/reference/analyze-behavior.md
      - src: docs/reference/analyze-behavior.zh-CN.md
        dst: docs/reference/analyze-behavior.zh-CN.md
      - src: docs/recipe/flashback.md
        dst: docs/recipe/flashback.md
      - src: docs/recipe/flashback.zh-CN.md
        dst: docs/recipe/flashback.zh-CN.md
      - src: docs/recipe/compare-trend-workflow.md
        dst: docs/recipe/compare-trend-workflow.md
      - src: docs/recipe/compare-trend-workflow.zh-CN.md
        dst: docs/recipe/compare-trend-workflow.zh-CN.md
      - src: docs/concept/architecture.md
        dst: docs/concept/architecture.md
      - src: docs/concept/architecture.zh-CN.md
        dst: docs/concept/architecture.zh-CN.md
      - src: cmd/binlogviz/testdata/minimal.binlog
        dst: testdata/minimal.binlog
      - src: cmd/binlogviz/testdata/sample-binlog/mysql-bin.000001
        dst: testdata/sample-binlog/mysql-bin.000001
      - src: scripts/release-incident.yaml
        dst: incident.yaml
      - src: docs/schema/analyze.json
        dst: docs/schema/analyze.json
      - src: docs/schema/flashback-plan.json
        dst: docs/schema/flashback-plan.json
      - src: docs/schema/compare.json
        dst: docs/schema/compare.json
      - src: docs/schema/trend.json
        dst: docs/schema/trend.json
      - src: docs/schema/snapshot-list.json
        dst: docs/schema/snapshot-list.json
      - src: docs/schema/snapshot-show.json
        dst: docs/schema/snapshot-show.json
      - src: docs/schema/workflow-validate.json
        dst: docs/schema/workflow-validate.json
      - src: docs/schema/workflow-describe.json
        dst: docs/schema/workflow-describe.json
      - src: docs/schema/workflow-status.json
        dst: docs/schema/workflow-status.json
      - src: docs/schema/workflow-clean.json
        dst: docs/schema/workflow-clean.json
      - src: docs/schema/workflow-export.json
        dst: docs/schema/workflow-export.json
      - src: docs/schema/version.json
        dst: docs/schema/version.json
      - src: docs/schema/flashback-verify.json
        dst: docs/schema/flashback-verify.json

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true
