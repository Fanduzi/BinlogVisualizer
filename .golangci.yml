# golangci-lint v2. CI runs it with --new-from-rev at the merge base
# (.github/workflows/lint.yml, make lint), so only issues on changed lines
# fail. Existing debt is ratcheted separately by internal/codehealth.
# Limits match docs/development/coding-standards.md.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - funlen
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unused
  settings:
    gocyclo:
      # Reports functions above 40.
      min-complexity: 40
    funlen:
      lines: 150
      statements: 100
      ignore-comments: true
    nolintlint:
      # A //nolint names the linter and says why: //nolint:errcheck // reason.
      require-specific: true
      require-explanation: true
  exclusions:
    # Generated-code markers are not honored: anyone can write one. Only the
    # files in generated_files of internal/codehealth/baseline.json are
    # skipped (none today), and TestGolangciSkipsOnlyAllowlistedGeneratedFiles
    # keeps the two lists equal.
    generated: disable
    paths: []
    rules:
      # Table-driven tests are long by design; complexity still applies.
      - path: _test\.go
        linters:
          - funlen

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: disable
    paths: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
