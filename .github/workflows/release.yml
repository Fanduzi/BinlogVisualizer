# input: version tags matching v*.
# output: tested darwin/linux amd64/arm64 release archives, a checksum manifest, and a GitHub Release with bilingual release notes.
# pos: the only trusted release pipeline, using native macOS runners plus manylinux2014-based Linux builds so artifact naming and Linux glibc compatibility stay aligned with install docs.
# note: if this file changes, keep .goreleaser.yml, install.sh, and README.md artifact naming in sync.

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true
      - name: Run tests
        run: go test ./...
      - name: Validate GoReleaser config
        run: goreleaser check

  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            build_mode: native
          - goos: darwin
            goarch: arm64
            runner: macos-14
            build_mode: native
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            build_mode: manylinux2014
            container_image: quay.io/pypa/manylinux2014_x86_64
            docker_platform: linux/amd64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            build_mode: manylinux2014
            container_image: quay.io/pypa/manylinux2014_aarch64
            docker_platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archive
        if: matrix.build_mode == 'native'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=1 \
            go build -trimpath -ldflags "-s -w -X binlogviz/internal/version.Version=${VERSION}" -o dist/binlogviz .
          ARCHIVE="binlogviz_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE}" binlogviz
          rm -f dist/binlogviz
      - name: Build Linux archive in manylinux2014 userspace
        if: matrix.build_mode == 'manylinux2014'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          GO_VERSION="$(go env GOVERSION | sed 's/^go//')"
          mkdir -p dist
          docker run --rm \
            --platform "${{ matrix.docker_platform }}" \
            -v "${PWD}:/src" \
            -w /src \
            -e VERSION="${VERSION}" \
            -e GO_VERSION="${GO_VERSION}" \
            -e TARGET_GOARCH="${{ matrix.goarch }}" \
            "${{ matrix.container_image }}" \
            bash -lc '
              set -euo pipefail
              export PATH="/usr/local/go/bin:${PATH}"
              GO_TARBALL="go${GO_VERSION}.linux-${TARGET_GOARCH}.tar.gz"
              curl -fsSLo "/tmp/${GO_TARBALL}" "https://go.dev/dl/${GO_TARBALL}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${GO_TARBALL}"
              go build -trimpath \
                -ldflags "-s -w -X binlogviz/internal/version.Version=${VERSION} -linkmode external -extldflags '\''-static-libstdc++ -static-libgcc'\''" \
                -o dist/binlogviz .
              MAX_GLIBC="$(strings dist/binlogviz | grep -o '\''GLIBC_[0-9.]*'\'' | sort -Vu | tail -1 || true)"
              if [[ -n "${MAX_GLIBC}" ]] && [[ "${MAX_GLIBC}" != "GLIBC_2.17" ]]; then
                if [[ "$(printf "%s\n%s\n" "GLIBC_2.17" "${MAX_GLIBC}" | sort -V | tail -1)" != "GLIBC_2.17" ]]; then
                  echo "glibc baseline check failed: ${MAX_GLIBC}" >&2
                  exit 1
                fi
              fi
              ARCHIVE="binlogviz_${VERSION}_linux_${TARGET_GOARCH}.tar.gz"
              tar -C dist -czf "dist/${ARCHIVE}" binlogviz
              rm -f dist/binlogviz
            '
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    name: github-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect artifacts, checksums, and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          find dist -type f -name '*.tar.gz' -exec cp {} release/ \;
          cd release
          shasum -a 256 *.tar.gz > "binlogviz_${VERSION}_checksums.txt"
          ENGLISH_NOTE="${GITHUB_WORKSPACE}/docs/releases/release-notes-v${VERSION}.md"
          CHINESE_NOTE="${GITHUB_WORKSPACE}/docs/releases/release-notes-v${VERSION}.zh-CN.md"
          if [[ ! -f "${ENGLISH_NOTE}" ]]; then
            echo "Missing release note file: ${ENGLISH_NOTE}" >&2
            exit 1
          fi
          if [[ ! -f "${CHINESE_NOTE}" ]]; then
            echo "Missing release note file: ${CHINESE_NOTE}" >&2
            exit 1
          fi
          grep -q "# BinlogViz v${VERSION} Release Notes" "${ENGLISH_NOTE}"
          grep -q "# BinlogViz v${VERSION} 发布说明" "${CHINESE_NOTE}"
          BODY_FILE="release-notes-v${VERSION}.md"
          {
            printf '## English\n\n'
            cat "${ENGLISH_NOTE}"
            printf '\n\n---\n\n## 中文\n\n'
            cat "${CHINESE_NOTE}"
          } > "${BODY_FILE}"
          printf 'RELEASE_BODY_PATH=%s/%s\n' "$PWD" "${BODY_FILE}" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_BODY_PATH }}
          files: |
            release/*.tar.gz
            release/*_checksums.txt

      - name: Generate Homebrew cask definition
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CHECKSUM_FILE="release/binlogviz_${VERSION}_checksums.txt"
          DARWIN_AMD64_SHA="$(awk '/binlogviz_'"${VERSION}"'_darwin_amd64.tar.gz$/ {print $1}' "${CHECKSUM_FILE}")"
          DARWIN_ARM64_SHA="$(awk '/binlogviz_'"${VERSION}"'_darwin_arm64.tar.gz$/ {print $1}' "${CHECKSUM_FILE}")"
          LINUX_AMD64_SHA="$(awk '/binlogviz_'"${VERSION}"'_linux_amd64.tar.gz$/ {print $1}' "${CHECKSUM_FILE}")"
          LINUX_ARM64_SHA="$(awk '/binlogviz_'"${VERSION}"'_linux_arm64.tar.gz$/ {print $1}' "${CHECKSUM_FILE}")"
          test -n "${DARWIN_AMD64_SHA}"
          test -n "${DARWIN_ARM64_SHA}"
          test -n "${LINUX_AMD64_SHA}"
          test -n "${LINUX_ARM64_SHA}"
          cat > release/binlogviz.rb <<EOF
          cask "binlogviz" do
            version "${VERSION}"

            on_macos do
              on_intel do
                sha256 "${DARWIN_AMD64_SHA}"
                url "https://github.com/Fanduzi/BinlogVisualizer/releases/download/${GITHUB_REF_NAME}/binlogviz_${VERSION}_darwin_amd64.tar.gz",
                    verified: "github.com/Fanduzi/BinlogVisualizer/"
              end
              on_arm do
                sha256 "${DARWIN_ARM64_SHA}"
                url "https://github.com/Fanduzi/BinlogVisualizer/releases/download/${GITHUB_REF_NAME}/binlogviz_${VERSION}_darwin_arm64.tar.gz",
                    verified: "github.com/Fanduzi/BinlogVisualizer/"
              end
            end

            on_linux do
              on_intel do
                sha256 "${LINUX_AMD64_SHA}"
                url "https://github.com/Fanduzi/BinlogVisualizer/releases/download/${GITHUB_REF_NAME}/binlogviz_${VERSION}_linux_amd64.tar.gz",
                    verified: "github.com/Fanduzi/BinlogVisualizer/"
              end
              on_arm do
                if Hardware::CPU.is_64_bit?
                  sha256 "${LINUX_ARM64_SHA}"
                  url "https://github.com/Fanduzi/BinlogVisualizer/releases/download/${GITHUB_REF_NAME}/binlogviz_${VERSION}_linux_arm64.tar.gz",
                      verified: "github.com/Fanduzi/BinlogVisualizer/"
                end
              end
            end

            name "BinlogViz"
            desc "Local CLI for MySQL ROW binlog analysis"
            homepage "https://github.com/Fanduzi/BinlogVisualizer"

            binary "binlogviz"

            postflight do
              if OS.mac?
                system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path/"binlogviz"]
              end
            end
          end
          EOF

      - name: Sync Homebrew tap cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAP_REPO="Fanduzi/homebrew-binlogviz"
          TAP_DIR="${RUNNER_TEMP}/homebrew-binlogviz"
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "${TAP_DIR}"
          gh auth setup-git
          gh repo clone "${TAP_REPO}" "${TAP_DIR}"
          mkdir -p "${TAP_DIR}/Casks"
          cp release/binlogviz.rb "${TAP_DIR}/Casks/binlogviz.rb"
          cd "${TAP_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- Casks/binlogviz.rb)" ]; then
            echo "No Homebrew cask changes to commit"
            exit 0
          fi
          git add Casks/binlogviz.rb
          git commit -m "chore: update binlogviz cask for ${TAG}"
          git push origin HEAD
