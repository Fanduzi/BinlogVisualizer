name: ci

on:
  push:
    branches:
      - main
  pull_request:
  # release.yml calls this workflow so a tag is built only after the tagged
  # commit passes verify and flashback e2e (production-readiness F3).
  workflow_call:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true
      - name: Run tests
        run: go test ./...
      - name: Validate GoReleaser config
        run: goreleaser check
      - name: Build local archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Same identity path as the Linux release build: no VCS stamping,
          # commit and commit time passed as ldflags (ADR 0010, #303).
          COMMIT_TIME="$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "${GITHUB_SHA}")"
          go build -buildvcs=false -trimpath \
            -ldflags "-X binlogviz/internal/version.Commit=${GITHUB_SHA} -X binlogviz/internal/version.CommitTime=${COMMIT_TIME}" \
            -o dist/binlogviz .
          bash scripts/pack_release_archive.sh dist/binlogviz dist/binlogviz_ci_linux_amd64.tar.gz
      - name: Smoke test packaged archive
        env:
          BINLOGVIZ_SMOKE_EXPECT_COMMIT: ${{ github.sha }}
          BINLOGVIZ_SMOKE_REQUIRE_COMMIT: "1"
        run: bash scripts/release_smoke.sh dist/binlogviz_ci_linux_amd64.tar.gz

  release-prep-selftest:
    name: release-prep self-test
    # The gate release.yml runs on a tag, exercised on every PR against fake
    # complete and incomplete releases so it cannot rot between releases.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the release-prep check
        run: bash scripts/check-release-prep-test.sh

  vet-race:
    name: vet and race
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test -race
        # The E1 memory tests skip under -race with a reason naming the verify
        # job, which still runs plain go test ./... (TestEveryMemoryTestRunsInCIVerify).
        run: go test -race -count=1 -timeout 40m ./...

  darwin-verify:
    name: darwin verify
    # The test suite is the only gate Linux runs that darwin users also run;
    # keep it green so a Linux-only test helper cannot quietly break them.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...

  flashback-e2e:
    name: flashback e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start preinstalled MySQL 8.0
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # ubuntu-24.04 runners already have mysql-server-8.0. apt-get update
          # talks to azure.archive.ubuntu.com first and, when that mirror stalls,
          # sits on Ign lines for tens of minutes. Run 37671384306 attempt 1
          # entered this step at 19:02:20Z and was still inside apt-get update
          # when the attempt was cancelled at 19:40:17Z. The unit also sets
          # TimeoutSec=infinity, so a later systemctl start can wait forever.
          if ! dpkg-query -W mysql-server-8.0 >/dev/null 2>&1 || ! command -v mysql >/dev/null 2>&1; then
            echo "ubuntu-24.04 runner is missing preinstalled MySQL 8.0 (mysql-server-8.0 and the mysql client)" >&2
            exit 1
          fi
          dpkg-query -W -f '${Package} ${Version}\n' mysql-server-8.0
          /usr/sbin/mysqld --version
          sudo mkdir -p /etc/systemd/system/mysql.service.d
          sudo tee /etc/systemd/system/mysql.service.d/timeout.conf >/dev/null <<'EOF'
          [Service]
          TimeoutStartSec=60
          TimeoutStopSec=30
          EOF
          sudo systemctl daemon-reload
          sudo systemctl show mysql.service -p TimeoutStartUSec -p TimeoutStopUSec --no-pager
          if sudo systemctl is-active --quiet mysql.service; then
            timeout 40 sudo systemctl stop mysql.service
          fi
          sudo tee /etc/mysql/mysql.conf.d/zz-binlogviz-flashback.cnf >/dev/null <<'EOF'
          [mysqld]
          server-id=1
          log_bin=mysql-bin
          binlog_format=ROW
          gtid_mode=ON
          enforce_gtid_consistency=ON
          binlog_row_image=FULL
          binlog_row_metadata=FULL
          binlog_checksum=CRC32
          binlog_rows_query_log_events=ON
          character-set-server=utf8mb4
          collation-server=utf8mb4_0900_ai_ci
          EOF
          # The datadir is mode 0700, so a glob in this shell does not expand.
          sudo bash -c 'rm -f /var/lib/mysql/binlog.[0-9]* /var/lib/mysql/mysql-bin.[0-9]* /var/lib/mysql/binlog.index /var/lib/mysql/mysql-bin.index'
          if ! timeout 90 sudo systemctl start mysql.service; then
            echo "MySQL 8.0 did not become ready within 90s" >&2
            sudo systemctl status mysql.service --no-pager >&2 || true
            sudo tail -n 80 /var/log/mysql/error.log >&2 || true
            exit 1
          fi
      - name: Verify MySQL 8.0 ROW/GTID/FULL
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # A stock Ubuntu package lets root in through the socket. The hosted
          # image keeps a password on root and does not load auth_socket, so
          # the packaged debian-sys-maint account is the login that works.
          query="SELECT @@version, @@log_bin, @@binlog_format, @@binlog_row_image, @@binlog_row_metadata, @@gtid_mode"
          if sudo mysql --protocol=socket --connect-timeout=10 -e "SELECT 1" </dev/null >/dev/null 2>&1; then
            echo 'BINLOGVIZ_MYSQL=sudo mysql --protocol=socket' >> "$GITHUB_ENV"
            line=$(sudo mysql --protocol=socket --connect-timeout=10 -N --batch -e "$query")
          else
            echo 'BINLOGVIZ_MYSQL=sudo mysql --defaults-file=/etc/mysql/debian.cnf --protocol=socket' >> "$GITHUB_ENV"
            line=$(sudo mysql --defaults-file=/etc/mysql/debian.cnf --protocol=socket --connect-timeout=10 -N --batch -e "$query")
          fi
          echo "server: $line"
          set -- $(printf '%s\n' "$line" | tr '\t' ' ')
          if [ "$#" -lt 6 ] || [[ "$1" != 8.0* ]] || [ "$2" != "1" ] || [ "$3" != "ROW" ] || [ "$4" != "FULL" ] || [ "$5" != "FULL" ] || [ "$6" != "ON" ]; then
            echo "server is not MySQL 8.0 ROW/GTID/FULL: $line" >&2
            exit 1
          fi
      - name: Round-trip flashback on MySQL 8.0
        timeout-minutes: 18
        run: |
          set -euo pipefail
          # A skip or a -run miss still exits 0. -v prints --- PASS; require every name.
          log=$(mktemp)
          BINLOGVIZ_FLASHBACK_E2E=1 go test -count=1 -timeout 12m -v ./cmd/binlogviz \
            -run 'TestFlashbackRoundTripMySQL80|TestNumericDecodeMySQL80|TestFlashbackFailedApplyDropsAndSignals' 2>&1 | tee "$log"
          if grep -E '^[[:space:]]*--- SKIP:' "$log"; then
            echo "MySQL e2e skipped" >&2
            exit 1
          fi
          for name in TestFlashbackRoundTripMySQL80 TestNumericDecodeMySQL80 TestFlashbackFailedApplyDropsAndSignals; do
            if ! grep -q -E "^--- PASS: ${name} \\(" "$log"; then
              echo "missing --- PASS for ${name}" >&2
              exit 1
            fi
          done
      - name: Guard SQL on MySQL 8.0
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The guard's message cut exists only in the emitted SQL, so these
          # tests run it on the server. A skip or a -run miss still exits 0.
          log=$(mktemp)
          BINLOGVIZ_GUARD_MYSQL="$BINLOGVIZ_MYSQL" go test -count=1 -timeout 4m -v ./internal/guard \
            -run 'OnServer' 2>&1 | tee "$log"
          if grep -E '^[[:space:]]*--- SKIP:' "$log"; then
            echo "guard server tests skipped" >&2
            exit 1
          fi
          for name in TestGuardMessageOnServer TestGuardMatchOnServer TestGuardMessageCutSweepOnServer; do
            if ! grep -q -E "^--- PASS: ${name} \\(" "$log"; then
              echo "missing --- PASS for ${name}" >&2
              exit 1
            fi
          done

  flashback-difftest:
    name: flashback difftest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql80:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: difftest
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdifftest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: difftest
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdifftest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install MySQL client
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y mysql-client
      - name: Enable ROW binlogs on the MySQL services
        run: |
          set -euo pipefail
          chmod +x scripts/difftest_enable_binlog.sh
          echo "DIFFTEST_DOCKER_80=$(bash scripts/difftest_enable_binlog.sh 3306 1)" >> "$GITHUB_ENV"
          echo "DIFFTEST_DOCKER_84=$(bash scripts/difftest_enable_binlog.sh 3307 2)" >> "$GITHUB_ENV"
      - name: Differential tests on MySQL 8.0
        env:
          BINLOGVIZ_DIFFTEST: "1"
          BINLOGVIZ_DIFFTEST_MYSQL: "mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -pdifftest"
          BINLOGVIZ_DIFFTEST_DOCKER: ${{ env.DIFFTEST_DOCKER_80 }}
        run: |
          set -euo pipefail
          log=$(mktemp)
          go test -count=1 -timeout 15m -v ./internal/mysqlexpr ./cmd/binlogviz \
            -run 'TestDiffMySQLExpressions|TestFlashbackDiffMySQL' 2>&1 | tee "$log"
          if grep -E '^[[:space:]]*--- SKIP:' "$log"; then
            echo "differential tests skipped" >&2
            exit 1
          fi
          for name in TestDiffMySQLExpressions TestFlashbackDiffMySQL; do
            if ! grep -q -E "^--- PASS: ${name} \\(" "$log"; then
              echo "missing --- PASS for ${name}" >&2
              exit 1
            fi
          done
      - name: Differential tests on MySQL 8.4
        env:
          BINLOGVIZ_DIFFTEST: "1"
          BINLOGVIZ_DIFFTEST_MYSQL: "mysql --protocol=tcp -h 127.0.0.1 -P 3307 -uroot -pdifftest"
          BINLOGVIZ_DIFFTEST_DOCKER: ${{ env.DIFFTEST_DOCKER_84 }}
        run: |
          set -euo pipefail
          log=$(mktemp)
          go test -count=1 -timeout 15m -v ./internal/mysqlexpr ./cmd/binlogviz \
            -run 'TestDiffMySQLExpressions|TestFlashbackDiffMySQL' 2>&1 | tee "$log"
          if grep -E '^[[:space:]]*--- SKIP:' "$log"; then
            echo "differential tests skipped" >&2
            exit 1
          fi
          for name in TestDiffMySQLExpressions TestFlashbackDiffMySQL; do
            if ! grep -q -E "^--- PASS: ${name} \\(" "$log"; then
              echo "missing --- PASS for ${name}" >&2
              exit 1
            fi
          done
