name: lint

# Coding-standards gate (docs/development/coding-standards.md). golangci-lint fails on
# findings the base revision does not have, matched by enclosing function so
# moved or renamed code keeps its findings; codehealth fails when the tree
# does not hold against internal/codehealth/baseline.json, when a generated
# file is not its generator's output, or when the change loosens the baseline
# compared with the base tree.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - name: Find the base revision
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: bash internal/codehealth/lint-base.sh >> "$GITHUB_OUTPUT"
      - name: golangci-lint findings not in the base revision
        run: go run ./internal/codehealth/cmd/codehealth -base "${{ steps.base.outputs.sha }}" lint

  codehealth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Find the base revision
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: bash internal/codehealth/lint-base.sh >> "$GITHUB_OUTPUT"
      - name: Tree holds against the baseline (files, functions, issue refs, deadcode)
        run: go run ./internal/codehealth/cmd/codehealth -deadcode check
      - name: Generated files are their generators' output
        run: |
          go run ./internal/codehealth/cmd/codehealth regen
          git diff --exit-code
      - name: Baseline is no looser than at the base revision
        env:
          BASE: ${{ steps.base.outputs.sha }}
          PAYDOWN: ${{ github.event_name == 'pull_request' && '-paydown' || '' }}
        run: go run ./internal/codehealth/cmd/codehealth -base "${BASE}" ${PAYDOWN} compare
